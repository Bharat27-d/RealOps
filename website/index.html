  <!-- Global Background Animation -->
  <div class="background-animation" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -2; opacity: 0.4; mix-blend-mode: screen;">
    <script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
    <div id="threejs-container" style="width:100%;height:100%"></div>
    <script>
      (function() {
        const container = document.getElementById('threejs-container');
        const width = container.clientWidth || window.innerWidth;
        const height = container.clientHeight || window.innerHeight;
        
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(width, height);
        container.appendChild(renderer.domElement);

        const primaryColor = 0xff6b35; 
        const accentColor = 0xf59e0b; 

        const group = new THREE.Group();
        scene.add(group);

        const coreGeom = new THREE.OctahedronGeometry(1.5, 0);
        const coreMat = new THREE.MeshPhongMaterial({ 
          color: primaryColor, 
          emissive: primaryColor,
          emissiveIntensity: 0.5,
          shininess: 100,
          transparent: true,
          opacity: 0.9
        });
        const coreMesh = new THREE.Mesh(coreGeom, coreMat);
        group.add(coreMesh);

        const ringGeom = new THREE.TorusGeometry(3, 0.03, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: accentColor, transparent: true, opacity: 0.4 });
        
        const rings = [];
        for(let i = 0; i < 3; i++) {
          const ring = new THREE.Mesh(ringGeom, ringMat);
          ring.rotation.x = Math.random() * Math.PI;
          ring.rotation.y = Math.random() * Math.PI;
          group.add(ring);
          rings.push({ mesh: ring, speed: 0.01 + Math.random() * 0.02 });
        }

        const particlesGeom = new THREE.BufferGeometry();
        const particlesCount = 200;
        const positions = new Float32Array(particlesCount * 3);
        for(let i = 0; i < particlesCount * 3; i++) {
          positions[i] = (Math.random() - 0.5) * 10;
        }
        particlesGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particlesMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.05, transparent: true, opacity: 0.6 });
        const particles = new THREE.Points(particlesGeom, particlesMat);
        scene.add(particles);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(primaryColor, 2, 20);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        camera.position.z = 8;

        function animate() {
          requestAnimationFrame(animate);
          
          group.rotation.y += 0.005;
          group.rotation.x += 0.003;
          
          rings.forEach(r => {
            r.mesh.rotation.z += r.speed;
          });

          const scale = 1 + Math.sin(Date.now() * 0.002) * 0.05;
          coreMesh.scale.set(scale, scale, scale);

          particles.rotation.y += 0.001;

          renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
          const w = container.clientWidth || window.innerWidth;
          const h = container.clientHeight || window.innerHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        });

        animate();
      })();
    </script>
